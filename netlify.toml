[build]
  command = "npm run build"
  publish = "dist"
  # No `functions` key on purpose: @astrojs/netlify emits its SSR function via
  # the Netlify Frameworks API into .netlify/v1/functions, which Netlify picks
  # up automatically. The old ".netlify/functions-internal" path pointed at a
  # directory this adapter version never writes.

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "false"

# The CMS moved from Decap (/admin) to Keystatic (/keystatic).
# Keep old bookmarks working.
[[redirects]]
  from = "/admin"
  to = "/keystatic"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/keystatic"
  status = 301
  force = true

# One article's file name contains a colon:
#   "Philadelphia Food Insecurity Solutions: Your Guide to Free Nutritional
#    Resources.md"
# The old slug helper kept that colon in the URL. Astro's Content Layer
# slugifies it away, so this one post moved. Every other URL is unchanged.
# 301 the old address so the existing ranking and any inbound links carry over.
[[redirects]]
  from = "/blog/philadelphia-food-insecurity-solutions:-your-guide-to-free-nutritional-resources/*"
  to = "/blog/philadelphia-food-insecurity-solutions-your-guide-to-free-nutritional-resources/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/philadelphia-food-insecurity-solutions%3A-your-guide-to-free-nutritional-resources/*"
  to = "/blog/philadelphia-food-insecurity-solutions-your-guide-to-free-nutritional-resources/"
  status = 301
  force = true

# /services was unused boilerplate from the original site template and has been
# removed. Send anyone holding the link to the real page.
[[redirects]]
  from = "/services"
  to = "/what-we-do"
  status = 301

[[redirects]]
  from = "/services/*"
  to = "/what-we-do"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://tinyurl.com https://script.google.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' https://tinyurl.com https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; upgrade-insecure-requests"

# The Keystatic editor is a React app that talks to Keystatic Cloud. It needs a
# wider policy than the public site, so it gets its own, and it is never indexed.
# connect-src, one host at a time:
#   api.keystatic.cloud       sign in, and every read and write of the repo
#   raw.githubusercontent.com file bodies, fetched directly because the repo is
#                             public (Keystatic skips the proxy for those)
#   avatars.githubusercontent.com  the signed in user's avatar
#   live.keystatic.cloud      multiplayer editing, if the team plan has it
# api.github.com and github.com were dropped with the self hosted GitHub App:
# in cloud mode the browser never calls GitHub directly.
[[headers]]
  for = "/keystatic/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.keystatic.cloud wss://live.keystatic.cloud https://raw.githubusercontent.com https://avatars.githubusercontent.com; form-action 'self'; worker-src 'self' blob:"

[[headers]]
  for = "/api/keystatic/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept"
